<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rôti de Lieu</title>

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Feuille de style personnalisée -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        :root {
            --ocean-dark:  #0d3d52;
            --ocean-mid:   #1a6b8a;
            --ocean-light: #e0f4f8;
            --ocean-accent:#2eabd1;
        }

        body {
            background-color: #f4fbfd;
        }

        /* Navbar */
        .navbar-custom {
            background: linear-gradient(90deg, var(--ocean-dark), var(--ocean-mid));
        }

        /* Header */
        .hero-custom {
            background: linear-gradient(135deg, var(--ocean-light) 0%, #c8eaf3 100%);
            border-bottom: 3px solid var(--ocean-accent);
        }

        /* Titres de section */
        .section-title {
            color: var(--ocean-dark);
            border-bottom: 3px solid var(--ocean-accent);
        }

        /* Séparateur */
        .custom-hr {
            border: none;
            height: 2px;
            background: linear-gradient(90deg, var(--ocean-accent), transparent);
        }

        /* Footer */
        .footer-custom {
            background: linear-gradient(90deg, var(--ocean-dark), var(--ocean-mid));
        }

        /* Titre hero */
        .hero-title {
            color: var(--ocean-dark);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }

        /* Lien footer */
        .footer-link {
            color: var(--ocean-accent) !important;
        }
        .footer-link:hover {
            color: #fff !important;
        }
    </style>
</head>

<body>

    <!-- ============================== NAVBAR ============================== -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-5" href="#">🐟 Rôti de Lieu</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item">
                        <a class="nav-link" href="#hero">Accueil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#ingredients">Ingrédients</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#etapes">Étapes</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ============================== HEADER / HERO ============================== -->
    <header id="hero" class="hero-custom py-5">
        <div class="container text-center">

            <p class="text-uppercase fw-semibold mb-1" style="color: var(--ocean-accent); letter-spacing: 3px; font-size: 0.85rem;">
                Recette du jour
            </p>

            <h1 class="display-3 fw-bold mb-2 hero-title">Rôti de Lieu</h1>

            <p class="text-muted mb-4" style="font-size: 1.1rem;">
                Un poisson savoureux, rôti à la perfection avec des herbes fraîches.
            </p>

            <!-- Score nutritionnel moyen (rempli par js/main.js) -->
            <div id="nutrition-score" class="mb-4"></div>

            <!-- Image de la recette -->
            <img
                src="https://assets.afcdn.com/recipe/20170607/67502_w600.jpg"
                alt="Image d'un rôti de lieu"
                class="img-fluid rounded-4 shadow-lg"
                style="max-height: 420px; object-fit: cover; width: 100%; border: 3px solid var(--ocean-accent);"
            >

        </div>
    </header>

    <!-- ============================== MAIN ============================== -->
    <main class="container my-5">

        <!-- Section Ingrédients -->
        <section id="ingredients" class="mb-5">
            <h2 class="mb-4 pb-2 section-title">🌿 Ingrédients</h2>
            <div id="productList" class="row g-4">
                <!-- Rempli dynamiquement par js/main.js -->
            </div>
        </section>

        <div class="custom-hr my-5"></div>

        <!-- Section Étapes -->
        <section id="etapes" class="mb-5">
            <h2 class="mb-4 pb-2 section-title">👨‍🍳 Étapes de préparation</h2>
            <div id="steps" class="list-group list-group-flush">
                <!-- Rempli dynamiquement par js/main.js -->
            </div>
        </section>

    </main>

    <!-- ============================== FOOTER ============================== -->
    <footer class="footer-custom text-light py-4 mt-5">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-start gap-2">
            <div>
                <p class="mb-1 fw-bold"><small>Chef de projet : Hélèna CHEVALIER</small></p>
                <p class="mb-0"><small>Rôti de Lieu &mdash; Projet équipe IF08</small></p>
            </div>
            <div class="text-md-end">
                <p class="mb-0">
                    <small>
                        <a href="https://www.marmiton.org" class="footer-link text-decoration-none">
                            Source : Marmiton
                        </a>
                    </small>
                </p>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script principal -->
    <script src="js/main.js"></script>

</body>

</html>
